name: Docker Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        run: |
          docker build \
            -f ToDoList/src/ToDoList.Api/Dockerfile \
            -t erkinbee/todolist-api:latest \
            ToDoList

          docker push erkinbee/todolist-api:latest

      - name: Build & push Blazor image
        run: |
          docker build \
            -f ToDoList/src/ToDoList.BlazorUI/Dockerfile \
            -t erkinbee/todolist-blazor:latest \
            ToDoList

          docker push erkinbee/todolist-blazor:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/todolist
            docker compose pull
            docker compose up -d
            docker image prune -f